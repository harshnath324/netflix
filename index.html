
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <style>
        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #141414;
    color: white;
    font-family: Arial, sans-serif;
}

/* Navbar */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 50px;
    background-color: black;
}

.logo {
    color: #e50914;
    font-size: 30px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 12px;
    font-size: 16px;
}

nav a:hover {
    color: #e50914;
}

.signin {
    background-color: #e50914;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
}

/* Hero Section */
.hero {
    height: 450px;
    background:
        linear-gradient(to right, #000 20%, transparent),
        url("https://picsum.photos/1400/700?random=10");

    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    padding: 50px;
}

.hero-content {
    max-width: 500px;
}

.hero h2 {
    font-size: 40px;
    margin-bottom: 20px;
}

.hero p {
    font-size: 18px;
    margin-bottom: 25px;
}

button {
    padding: 12px 25px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

.play {
    background-color: white;
    color: black;
}

.info {
    background-color: gray;
    color: white;
    margin-left: 10px;
}

/* Movies */
.movies {
    padding: 30px 50px;
}

.movies h2 {
    margin-bottom: 20px;
}

.movie-container {
    display: flex;
    gap: 15px;
    overflow-x: auto;
}

.movie img {
    width: 180px;
    height: 250px;
    object-fit: cover;
    border-radius: 8px;
    transition: transform 0.3s;
}

.movie img:hover {
    transform: scale(1.08);
}

/* Footer */
footer {
    text-align: center;
    padding: 25px;
    background-color: black;
    margin-top: 40px;
    color: gray;
}

/* Responsive Design */
@media (max-width: 600px) {
    header {
        padding: 15px;
        flex-wrap: wrap;
        gap: 15px;
    }

    nav a {
        margin: 5px;
        font-size: 13px;
    }

    .hero {
        height: 350px;
        padding: 25px;
    }

    .hero h2 {
        font-size: 28px;
    }

    .movies {
        padding: 20px;
    }

    .movie img {
        width: 130px;
        height: 190px;
    }
}

    </style>
</head>
<body>

    <!-- Navbar -->
    <header>
        <h1 class="logo">NETFLIX</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">TV Shows</a>
            <a href="#">Movies</a>
            <a href="#">My List</a>
        </nav>

        <button class="signin">Sign In</button>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h2>Unlimited Movies,<br> TV Shows and More.</h2>

            <p>Watch anywhere. Cancel anytime.</p>

            <button class="play">▶ Play</button>
            <button class="info">More Info</button>
        </div>
    </section>

    <!-- Movie Section -->
    <section class="movies">
        <h2>Popular on Netflix</h2>

        <div class="movie-container">
            <div class="movie">
                <img src="https://picsum.photos/200/280?random=1">
            </div>

            <div class="movie">
                <img src="https://picsum.photos/200/280?random=2">
            </div>

            <div class="movie">
                <img src="https://picsum.photos/200/280?random=3">
            </div>

            <div class="movie">
                <img src="https://picsum.photos/200/280?random=4">
            </div>

            <div class="movie">
                <img src="https://picsum.photos/200/280?random=5">
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Netflix Clone | Made for Learning</p>
    </footer>

</body>
</html>
